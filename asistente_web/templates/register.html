<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="register-body">

    <!-- Video de fondo -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='vid/neon-matrix.mp4') }}" type="video/mp4">
        <source src="{{ url_for('static', filename='vid/neon-matrix.webm') }}" type="video/webm">
        Tu navegador no soporta videos HTML5.
    </video>

    <div class="register-container">
        <h2>Registro de Usuario</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="register-form">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" placeholder="Escribe tu usuario" required />

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="••••••••" required />

            <label for="confirm_password">Confirmar contraseña</label>
            <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                placeholder="••••••••"
                required
            />

            <button type="submit" class="btn-register">Registrarse</button>
        </form>

        <p class="login-link">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión aquí</a>
        </p>
    </div>
</body>
</html>
